name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-ml-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: risklens_ci
          POSTGRES_USER: risklens
          POSTGRES_PASSWORD: risklens_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risklens -d risklens_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt
      - run: pip install -r backend/requirements.txt -r ml/requirements.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - name: Apply migrations on PostgreSQL
        run: alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://risklens:risklens_ci_password@localhost:5432/risklens_ci
      - name: Check PostgreSQL schema drift
        run: alembic -c backend/alembic.ini check
        env:
          DATABASE_URL: postgresql+psycopg://risklens:risklens_ci_password@localhost:5432/risklens_ci
      - run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
