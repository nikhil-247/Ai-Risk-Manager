services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: risklens
      POSTGRES_USER: risklens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risklens_local_dev_password}
    volumes:
      - risklens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risklens -d risklens"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://risklens:${POSTGRES_PASSWORD:-risklens_local_dev_password}@db:5432/risklens
      RISKLENS_EVALUATION_PATH: /app/artifacts/benchmark_report.json
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  risklens-postgres-data:
