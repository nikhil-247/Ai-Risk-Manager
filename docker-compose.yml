services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: risklens
      POSTGRES_USER: risklens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - risklens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risklens -d risklens"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - risklens-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://risklens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/risklens
      RISKLENS_ENV: ${RISKLENS_ENV:-development}
      RISKLENS_EVALUATION_PATH: /app/artifacts/benchmark_report.json
      RISKLENS_JWT_SECRET: ${RISKLENS_JWT_SECRET:?Set RISKLENS_JWT_SECRET in .env (see .env.example)}
      RISKLENS_REDIS_URL: ${RISKLENS_REDIS_URL:-redis://redis:6379/0}
      RISKLENS_CORS_ORIGINS: ${RISKLENS_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RISKLENS_PUBLIC_APP_URL: ${RISKLENS_PUBLIC_APP_URL:-http://localhost:5173}
      RISKLENS_SMTP_HOST: ${RISKLENS_SMTP_HOST:-}
      RISKLENS_SMTP_PORT: ${RISKLENS_SMTP_PORT:-587}
      RISKLENS_SMTP_USERNAME: ${RISKLENS_SMTP_USERNAME:-}
      RISKLENS_SMTP_PASSWORD: ${RISKLENS_SMTP_PASSWORD:-}
      RISKLENS_EMAIL_FROM: ${RISKLENS_EMAIL_FROM:-}
      RISKLENS_BOOTSTRAP_ADMIN_EMAIL: ${RISKLENS_BOOTSTRAP_ADMIN_EMAIL:-}
      RISKLENS_BOOTSTRAP_ADMIN_PASSWORD: ${RISKLENS_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  risklens-postgres-data:
  risklens-redis-data:
